<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Card</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background-color: #bdbdbd;
        }

        .card{
            width: 320px;
            margin: 40px auto;
            background-color: white;
            border-radius: 12px;
            padding: 10px;
        }

        .card img{
            width: 100%;
            border-radius: 10px;
        }

        .tags{
            margin-top: 12px;
        }

        .tags span{
            display: inline-block;
            border: 1px solid gray;
            border-radius: 20px;
            padding: 5px 12px;
            margin-right: 8px;
            font-size: 14px;
            color: gray;
        }

        h2{
            margin: 15px 0 10px;
        }

        p{
            color: #555;
            line-height: 1.5;
        }

        .btn{
            text-align: center;
            margin: 25px 0 15px;
        }

        .btn a{
            text-decoration: none;
            background-color: #d9ecff;
            color: blue;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: bold;
        }

        .btn a:hover{
            background-color: #bcdfff;
        }
    </style>
</head>

<body>

    <div class="card">

        <img src="pic.jpg" alt="Nature">

        <div class="tags">
            <span>Nature</span>
            <span>Lake</span>
        </div>

        <h2>Beautiful Nature</h2>

        <p>
            Nature is one of the most beautiful gifts on Earth. It provides peace,
            fresh air, and amazing landscapes that make our lives better.
        </p>

        <div class="btn">
            <a href="https://en.wikipedia.org/wiki/Nature" target="_blank">
                Read More
            </a>
        </div>

    </div>

</body>
</html>
